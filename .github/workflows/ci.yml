name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The project targets Windows, so the CI pipeline runs on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  packaging-windows:
    # Produce and upload the Windows release artifacts (dist/windows). Runs
    # only after the checks above pass: `needs: ci` makes the run fail fast,
    # so a failing fmt/clippy/test check stops the pipeline before packaging
    # ever starts. The job explicitly verifies the packaging manifest in all
    # four required areas — manifest validity, product.version vs the Cargo
    # workspace version, the target block vs the pinned x86_64-pc-windows-msvc
    # packaging target, and the release metadata (license / publisher /
    # release_channel) — twice, with no duplicated logic: first the sandboxed
    # self-test gates (test-build.ps1, 26 cases, plus
    # test-verify-checksums.ps1, 14 cases, for the consumer-side checksum
    # verifier) prove the scripts reject every violation, then build.ps1
    # -SkipBuild re-runs the same read-only
    # validation against the committed manifest.json and the real Cargo.toml
    # before anything is staged. The release binaries are built here
    # (cargo build --release) and the packaging script is invoked with
    # -SkipBuild, which stages and verifies the freshly built artifacts
    # without rebuilding. The staged directory is uploaded as a
    # channel-suffixed workflow artifact (nextide-windows-dist-<channel>):
    # right after checkout the job reads release.release_channel from the
    # committed packaging/windows/manifest.json (read-only, no network) and
    # uses it as the artifact name suffix, so stable and beta runs can never
    # overwrite each other's artifact in the Actions artifact store. Before
    # the upload, the staged CLI binary itself is smoke-tested end to end
    # (nextide-cli.exe smoke), so the artifact that ships is proven to run,
    # not just to hash-match its source. Alongside the staged binaries the
    # job also uploads the committed packaging/windows/manifest.json as a
    # channel-suffixed release-metadata artifact (nextide-windows-manifest-
    # <channel>): the validated product identity (name/version), pinned
    # target, release metadata (license / publisher / release_channel) and
    # artifact list that produced this release travel with it, so later
    # release/publish steps can consume the exact single source of truth
    # without re-deriving anything. Immediately before that upload a
    # lightweight gate re-reads the exact file about to be uploaded with
    # PowerShell's built-in ConvertFrom-Json (no dependencies, no network, no
    # cargo invocation) and re-asserts the validated identity inline — valid
    # JSON, schema_version 1, product name/version, the pinned target block,
    # the release metadata and a non-empty artifact list, plus a cross-check
    # that the file's release_channel equals the channel resolved for this
    # run — so the uploaded manifest is proven consistent with the manifest
    # the pipeline validated and with the channel in the artifact name. The
    # staged directory also carries a generated SHA-256 checksum manifest
    # (SHA256SUMS.txt, named by the manifest's stage.checksum_file): build.ps1
    # -SkipBuild writes it from the verified staged hashes and re-verifies it
    # on the spot, and a dedicated pre-upload gate runs the repository's
    # consumer-side verifier (packaging/windows/verify-checksums.ps1) read-only
    # against the exact dist/windows contents right before the dist upload, so
    # consumers of the dist artifact can verify every binary against the
    # checksum manifest that ships with it. The verifier's own sandboxed
    # self-test suite (test-verify-checksums.ps1) runs as an additional
    # pre-packaging gate alongside test-build.ps1.
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release channel and checksum file from manifest (artifact name suffix)
        # Read release.release_channel and stage.checksum_file out of the
        # committed packaging manifest (packaging/windows/manifest.json) so the
        # workflow artifact carries the channel in its name — stable and beta
        # runs can never overwrite each other's artifact — and so the checksum
        # manifest name flows from the single source of truth instead of being
        # hardcoded: build.ps1 generates exactly the file stage.checksum_file
        # declares, and the verify gates and release publish steps below
        # consume that same declared name. Read-only parse of a local file —
        # no network, no cargo invocation. The channel must be exactly stable
        # or beta and the checksum file must be non-blank, the same rules
        # build.ps1 enforces (and the self-test gate and the -SkipBuild run
        # re-verify against the same committed manifest), so an undeclared
        # channel or checksum file fails the run here, before the self-test
        # gate, the release build, and staging. The values are also exposed as
        # the step outputs release_channel and checksum_file for any later step
        # to consume.
        id: release-channel
        shell: pwsh
        run: |
          $Manifest = Get-Content -Raw -LiteralPath 'packaging/windows/manifest.json' | ConvertFrom-Json
          $Channel = $Manifest.release.release_channel
          if ($Channel -ne 'stable' -and $Channel -ne 'beta') {
            throw "Manifest release.release_channel must be exactly stable or beta, got: '$Channel'"
          }
          $ChecksumFile = ''
          if ($null -ne $Manifest.stage) { $ChecksumFile = [string]$Manifest.stage.checksum_file }
          if ([string]::IsNullOrWhiteSpace($ChecksumFile)) {
            throw 'Manifest stage.checksum_file is missing or blank'
          }
          Write-Host "release_channel=$Channel checksum_file=$ChecksumFile"
          "release_channel=$Channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_file=$ChecksumFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify manifest / version / target / metadata (test-build.ps1 gate)
        # Pre-packaging self-test gate: this is the CI job's explicit
        # verification of the packaging manifest in all four required areas,
        # exercised through build.ps1's own validation by the sandboxed suite
        # (26 cases, zero framework):
        #   - manifest validity:  missing/invalid JSON, schema_version,
        #                         artifact list, path escapes
        #   - version:            product.version == Cargo.toml
        #                         [workspace.package] version
        #   - target:             os/architecture/triple == pinned
        #                         x86_64-pc-windows-msvc packaging target
        #   - release metadata:   license/publisher required, release_channel
        #                         exactly stable or beta
        # Every test runs build.ps1 against a throwaway sandbox copy under
        # $env:TEMP and never touches the repository, so a failing test stops
        # the run before anything is built or staged.
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\test-build.ps1

      - name: Verify checksum consumer script (test-verify-checksums.ps1 gate)
        # Pre-packaging self-test gate for the consumer-side checksum verifier
        # (packaging/windows/verify-checksums.ps1): the sandboxed suite (14
        # cases, zero framework) proves the script accepts a consistent staging
        # directory + SHA256SUMS.txt (happy path, GNU-style lowercase hashes,
        # CRLF line endings, a custom -ChecksumFile name), rejects a bad hash,
        # a missing file, a malformed line, an empty manifest, a
        # path-escaped/duplicate entry and an extra unlisted file, and never
        # writes to the directory it verifies (read-only snapshot assertion).
        # Every case runs the verifier against a throwaway sandbox under
        # $env:TEMP — the repository is never touched — so a failing test
        # stops the run before anything is built or staged.
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\test-verify-checksums.ps1

      - name: Build release binaries
        # --locked: the workspace's Cargo.lock is committed and is the exact
        # dependency graph the release was tested against; the release build
        # must use it (a stale/out-of-date lockfile fails the build loudly
        # instead of silently regenerating it mid-release).
        run: cargo build --release --locked

      - name: Stage release artifacts into dist/windows (-SkipBuild)
        # Re-runs the same read-only manifest verification the self-test gate
        # covered (manifest validity, version, target, release metadata,
        # checksum file name) against the committed manifest.json and the
        # real Cargo.toml before staging anything, then verifies each staged
        # artifact by size and SHA-256 and writes the manifest-declared
        # checksum manifest (stage.checksum_file, resolved by the step above)
        # from the verified hashes (re-verifying it by parsing it back). No
        # rebuild: the release binaries from the step above are staged as-is.
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -SkipBuild

      - name: Smoke-test the staged CLI artifact (nextide-cli.exe smoke)
        # End-to-end proof that the packaged binary actually runs: execute the
        # staged release executable's editor-kernel smoke flow (apply an edit,
        # undo, redo, assert the document text) directly from dist/windows.
        # The CLI panics on any failure, so a non-zero exit fails the run
        # before the artifact is uploaded — hash equality alone would not
        # catch a binary that fails to start or misbehaves at runtime. The
        # headless shell is not executed here (it starts an event loop and
        # would block the runner).
        run: .\dist\windows\nextide-cli.exe smoke

      - name: Verify ${{ steps.release-channel.outputs.checksum_file }} before dist artifact upload
        # Pre-upload gate for the checksum manifest that ships inside
        # dist/windows. build.ps1 -SkipBuild (step above) generated the
        # manifest-declared checksum file (stage.checksum_file, resolved right
        # after checkout) from the verified staged hashes and already
        # re-verified it; this step runs the repository's consumer-side
        # verifier (packaging/windows/verify-checksums.ps1 — the same script
        # dist consumers use) read-only against the exact directory about to
        # be uploaded — no dependencies, no network, nothing written — proving
        # the manifest parses line by line ('<64-hex-sha256>  <file>'), every
        # named file exists, every entry's hash equals the actual SHA-256 of
        # the file, and the directory matches the manifest exactly (no
        # missing, corrupt, extra or duplicate entries). Any failure exits
        # non-zero before the upload, so the checksum manifest that ships is
        # proven correct, not just present.
        env:
          CHECKSUM_FILE: ${{ steps.release-channel.outputs.checksum_file }}
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\verify-checksums.ps1 -DistDir dist\windows -ChecksumFile "dist\windows\$env:CHECKSUM_FILE"

      - name: Upload dist/windows artifact
        # The artifact name carries the manifest's release_channel suffix
        # (resolved by the step above), so stable and beta runs produce
        # distinct artifacts and can never overwrite each other. The uploaded
        # directory includes the manifest-declared checksum manifest generated
        # and verified by build.ps1 -SkipBuild and re-verified by the step
        # above, so consumers of the artifact can verify every binary against
        # the manifest that ships with it.
        uses: actions/upload-artifact@v4
        with:
          name: nextide-windows-dist-${{ steps.release-channel.outputs.release_channel }}
          path: dist/windows
          if-no-files-found: error

      - name: Verify manifest.json before release-metadata upload
        # Lightweight pre-upload gate for the release-metadata artifact. The
        # exact file about to be uploaded (the committed
        # packaging/windows/manifest.json) is re-read and parsed with
        # PowerShell's built-in ConvertFrom-Json — no dependencies, no
        # network, no cargo invocation — so a missing, corrupt, truncated or
        # invalid-JSON file fails the run right here, before any upload. The
        # step then re-asserts, inline, the same identity the pipeline
        # already validated (the self-test gate and build.ps1 -SkipBuild):
        # schema_version must be 1, product name/version must be present, the
        # target block must equal the pinned windows / x86_64 /
        # x86_64-pc-windows-msvc packaging target, the release block must
        # carry non-empty license/publisher with a release_channel of exactly
        # stable or beta, stage.checksum_file must be a plain leaf name that
        # does not collide with any artifact file, and the artifact list must
        # be non-empty — and the
        # file's release_channel must equal the channel this run resolved
        # right after checkout (steps.release-channel), so the uploaded
        # manifest is proven consistent with the manifest the run validated
        # and with the channel embedded in the artifact name. Any mismatch
        # fails the run before the upload.
        shell: pwsh
        env:
          RESOLVED_CHANNEL: ${{ steps.release-channel.outputs.release_channel }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ManifestPath = 'packaging/windows/manifest.json'
          if (-not (Test-Path -LiteralPath $ManifestPath)) {
            throw "Missing manifest to upload: $ManifestPath"
          }
          try {
            $Manifest = Get-Content -Raw -LiteralPath $ManifestPath | ConvertFrom-Json
          }
          catch {
            throw "Manifest to upload is not valid JSON: $($_.Exception.Message)"
          }

          if ($Manifest.schema_version -ne 1) {
            throw "Manifest schema_version must be 1, got: '$($Manifest.schema_version)'"
          }
          if ($null -eq $Manifest.product -or [string]::IsNullOrWhiteSpace([string]$Manifest.product.name)) {
            throw 'Manifest product.name is missing or blank'
          }
          if ([string]::IsNullOrWhiteSpace([string]$Manifest.product.version)) {
            throw 'Manifest product.version is missing or blank'
          }
          if ($Manifest.target.os -ne 'windows') {
            throw "Manifest target.os must be 'windows', got: '$($Manifest.target.os)'"
          }
          if ($Manifest.target.architecture -ne 'x86_64') {
            throw "Manifest target.architecture must be 'x86_64', got: '$($Manifest.target.architecture)'"
          }
          if ($Manifest.target.triple -ne 'x86_64-pc-windows-msvc') {
            throw "Manifest target.triple must be 'x86_64-pc-windows-msvc', got: '$($Manifest.target.triple)'"
          }
          if ($null -eq $Manifest.release -or [string]::IsNullOrWhiteSpace([string]$Manifest.release.license)) {
            throw 'Manifest release.license is missing or blank'
          }
          if ([string]::IsNullOrWhiteSpace([string]$Manifest.release.publisher)) {
            throw 'Manifest release.publisher is missing or blank'
          }
          $Channel = [string]$Manifest.release.release_channel
          if ($Channel -ne 'stable' -and $Channel -ne 'beta') {
            throw "Manifest release.release_channel must be exactly 'stable' or 'beta', got: '$Channel'"
          }
          if ($Channel -ne $env:RESOLVED_CHANNEL) {
            throw "Manifest release_channel '$Channel' does not match the channel resolved for this run: '$env:RESOLVED_CHANNEL'"
          }
          if ($null -eq $Manifest.stage -or [string]::IsNullOrWhiteSpace([string]$Manifest.stage.checksum_file)) {
            throw 'Manifest stage.checksum_file is missing or blank'
          }
          if ($Manifest.stage.checksum_file -match '[\\/]' -or $Manifest.stage.checksum_file -eq '.' -or $Manifest.stage.checksum_file -eq '..') {
            throw "Manifest stage.checksum_file must be a plain file name, got: '$($Manifest.stage.checksum_file)'"
          }
          $Artifacts = @($Manifest.artifacts)
          if ($Artifacts.Count -eq 0) {
            throw 'Manifest declares no artifacts'
          }
          foreach ($Artifact in $Artifacts) {
            if ([string]::IsNullOrWhiteSpace([string]$Artifact.id) -or
                [string]::IsNullOrWhiteSpace([string]$Artifact.file) -or
                [string]::IsNullOrWhiteSpace([string]$Artifact.source)) {
              throw 'Every manifest artifact needs non-empty id, file and source'
            }
            if ($Artifact.file -eq $Manifest.stage.checksum_file) {
              throw "Manifest stage.checksum_file '$($Manifest.stage.checksum_file)' collides with artifact file '$($Artifact.file)'"
            }
          }
          Write-Host "Manifest OK: valid JSON, schema $($Manifest.schema_version), product $($Manifest.product.name) $($Manifest.product.version), target $($Manifest.target.os)/$($Manifest.target.architecture) ($($Manifest.target.triple)), channel $Channel, $($Artifacts.Count) artifacts, checksum file $($Manifest.stage.checksum_file)"

      - name: Upload manifest.json release metadata artifact
        # Upload the committed packaging manifest as release metadata next to
        # the staged binaries. manifest.json is the exact single source of
        # truth the whole packaging pipeline consumed and validated (self-test
        # gate, then read-only by build.ps1 -SkipBuild against the real
        # Cargo.toml): product identity, pinned target, release metadata
        # (license / publisher / release_channel) and the artifact list. The
        # step above re-parsed this exact file with ConvertFrom-Json and
        # re-asserted that identity right before this upload, so the file
        # that ships is proven valid JSON and consistent with the validated
        # manifest. Shipping it with the release lets later release/publish
        # steps attach the metadata without re-deriving anything. The
        # artifact name uses the same resolved release_channel output as the
        # dist artifact, so stable and beta runs keep their release metadata
        # separate too.
        uses: actions/upload-artifact@v4
        with:
          name: nextide-windows-manifest-${{ steps.release-channel.outputs.release_channel }}
          path: packaging/windows/manifest.json
          if-no-files-found: error

  release:
    # Publish the packaged Windows artifacts to a GitHub Release. This is the
    # terminal step of the release chain: `ci` proves fmt/clippy/test,
    # `packaging-windows` builds, stages, verifies and uploads the dist and
    # manifest artifacts, and this job — on a version-tag push only — turns
    # those verified artifacts into an actual GitHub Release. It never
    # rebuilds, never re-stages and never recomputes any checksum: it
    # consumes the artifacts the packaging job uploaded for this exact run
    # and re-verifies them with the repository's own consumer-side verifier
    # (packaging/windows/verify-checksums.ps1 — the same script dist
    # consumers use), so the files attached to the release are proven
    # byte-for-byte consistent with the checksum manifest that ships with
    # them. Tag/version consistency is enforced here as the final link of
    # the chain: the pushed tag must be `v<semver>` (e.g. `v0.1.0`) and its
    # version must equal `product.version` in the committed manifest, which
    # the packaging job already proved equals the [workspace.package] version
    # in the root Cargo.toml — so the release is always tagged with exactly
    # the version the artifacts claim. The job's own gate rules are proven
    # first by a sandboxed simulation suite (test-release-sim.ps1, 26 cases,
    # zero framework) that runs right after checkout, before anything is
    # downloaded or published: it exercises the tag/version rejection rules,
    # the four-file release file manifest and the publish step's attachment
    # naming against throwaway %TEMP%
    # sandboxes — no network access, no GitHub Release ever created, the
    # repository never touched. The checksum file attached to the release is
    # not hardcoded: its name flows from the committed manifest's
    # stage.checksum_file (the same single source of truth build.ps1 generates
    # from), resolved by the release-meta step below and consumed by the
    # verify and publish steps, so a manifest that renames the checksum file
    # keeps the whole chain consistent instead of breaking it incoherently.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packaging-windows
    runs-on: windows-latest
    permissions:
      # Job-scoped least privilege: creating the GitHub Release needs
      # contents: write; downloading this run's workflow artifacts needs
      # actions: read. Nothing else is granted to this job's token.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify release job simulation (test-release-sim.ps1 gate)
        # Pre-publish self-test gate for this job's own rules, run in a
        # sandbox before anything is downloaded or published. The zero-framework
        # suite (26 cases) proves, in two parts, exactly what this job gates:
        #   - tag/version rejection rules (the "Resolve release metadata from
        #     manifest (channel + version + checksum file vs tag)" logic):
        #     channel must be exactly stable or beta, product.version must be
        #     non-blank, stage.checksum_file must be non-blank, the pushed tag
        #     must be exactly v<product.version> — non-v tags, malformed
        #     semver (v0.1, v0.1.0.1), pre-release tags (v0.1.0-beta), tags
        #     that disagree with the manifest version, invalid channels, blank
        #     versions or checksum files, invalid JSON and missing manifests
        #     are all rejected; the committed manifest resolves with its
        #     matching tag.
        #   - release file manifest (the four files the publish step attaches:
        #     nextide-cli.exe, nextide-shell.exe, the manifest-declared
        #     checksum file (stage.checksum_file) and
        #     release-metadata/manifest.json): every attachment present and
        #     non-empty, the dist directory passing the repository's own
        #     consumer-side verifier (verify-checksums.ps1 — the same gate
        #     this job runs on the downloaded bytes), the checksum entries
        #     exactly matching the manifest artifact list, and the metadata
        #     manifest byte-identical to the committed one.
        #   - publish attachment naming (the exact file list this job hands to
        #     the GitHub CLI): the four paths are built from the resolved
        #     stage.checksum_file — 'dist/windows/<checksum file>' for the
        #     checksum entry, never a hardcoded default — so a renamed
        #     checksum file in the committed manifest flows coherently through
        #     resolve, verify, checklist and the release's attachment list.
        # Every case runs against a throwaway sandbox under $env:TEMP — no
        # network access, no GitHub Release ever created, the repository never
        # touched — so a failing test stops the run before anything is
        # downloaded or published.
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\test-release-sim.ps1

      - name: Resolve release metadata from manifest (channel + version + checksum file vs tag)
        # Read the committed packaging/windows/manifest.json (read-only local
        # parse, no network, no cargo invocation — same source and same
        # stable/beta rule the packaging job's resolve step and build.ps1
        # enforce) and assert the final consistency link: the pushed tag must
        # be exactly `v<product.version>` (v-prefixed semver), so the release
        # is created under the tag that names the artifacts' validated
        # version. The step also reads stage.checksum_file — the manifest
        # declares the name of the checksum manifest that ships inside
        # dist/windows, and it must be non-blank (build.ps1 and the packaging
        # job already proved the full leaf-name validation; this step only
        # needs the value for the verify and publish steps below and fails
        # fast rather than silently defaulting). The resolved channel, version
        # and checksum file are exposed as step outputs so the artifact
        # downloads, the verify gate and the release notes below can consume
        # them. Any mismatch — a non-v tag, a malformed version, a tag that
        # disagrees with the manifest, or a blank checksum file — fails the
        # run before anything is downloaded or published.
        id: release-meta
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ManifestPath = 'packaging/windows/manifest.json'
          if (-not (Test-Path -LiteralPath $ManifestPath)) {
            throw "Missing manifest: $ManifestPath"
          }
          try {
            $Manifest = Get-Content -Raw -LiteralPath $ManifestPath | ConvertFrom-Json
          }
          catch {
            throw "Manifest is not valid JSON: $($_.Exception.Message)"
          }
          $Channel = [string]$Manifest.release.release_channel
          if ($Channel -ne 'stable' -and $Channel -ne 'beta') {
            throw "Manifest release.release_channel must be exactly 'stable' or 'beta', got: '$Channel'"
          }
          $Version = [string]$Manifest.product.version
          if ([string]::IsNullOrWhiteSpace($Version)) {
            throw 'Manifest product.version is missing or blank'
          }
          $ChecksumFile = ''
          if ($null -ne $Manifest.stage) { $ChecksumFile = [string]$Manifest.stage.checksum_file }
          if ([string]::IsNullOrWhiteSpace($ChecksumFile)) {
            throw 'Manifest stage.checksum_file is missing or blank'
          }
          $Tag = $env:REF_NAME
          if ($Tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag '$Tag' is not a v-prefixed semver tag (expected e.g. v0.1.0)"
          }
          if ($Tag.Substring(1) -ne $Version) {
            throw "Release tag '$Tag' does not match manifest product.version '$Version' (tag must be v<product.version>)"
          }
          Write-Host "release: channel=$Channel version=$Version checksum_file=$ChecksumFile tag=$Tag"
          "channel=$Channel"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$Version"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_file=$ChecksumFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download dist/windows artifact (channel-suffixed)
        # Download the exact staged directory the packaging job verified and
        # uploaded for this run (nextide-windows-dist-<channel>). The
        # channel-suffixed name guarantees this job consumes the artifact of
        # this run's channel — stable and beta runs can never cross-consume.
        uses: actions/download-artifact@v4
        with:
          name: nextide-windows-dist-${{ steps.release-meta.outputs.channel }}
          path: dist/windows

      - name: Download manifest.json release-metadata artifact (channel-suffixed)
        # Download the exact validated release metadata the packaging job
        # uploaded (nextide-windows-manifest-<channel>) — the artifact to be
        # attached to the release, so the release carries the precise identity
        # (product, target, release metadata, artifact list) the pipeline
        # validated, never re-derived in this job.
        uses: actions/download-artifact@v4
        with:
          name: nextide-windows-manifest-${{ steps.release-meta.outputs.channel }}
          path: release-metadata

      - name: Verify downloaded manifest matches the committed manifest
        # Prove the release-metadata artifact is byte-identical to the
        # committed packaging/windows/manifest.json the whole pipeline
        # validated: the metadata attached to the release is exactly the
        # single source of truth that was checked, not a look-alike. A
        # tampered or mismatched upload fails the run before publishing.
        shell: pwsh
        run: |
          $Committed = (Get-FileHash -LiteralPath 'packaging/windows/manifest.json' -Algorithm SHA256).Hash
          $Downloaded = Get-ChildItem -LiteralPath 'release-metadata' -Filter 'manifest.json' -File
          if ($null -eq $Downloaded) {
            throw 'Downloaded release-metadata artifact contains no manifest.json'
          }
          $Actual = (Get-FileHash -LiteralPath $Downloaded.FullName -Algorithm SHA256).Hash
          if ($Committed -ne $Actual) {
            throw "Downloaded manifest does not match the committed manifest (committed $Committed, downloaded $Actual)"
          }
          Write-Host "manifest.json verified: downloaded artifact is byte-identical to the committed manifest"

      - name: Verify ${{ steps.release-meta.outputs.checksum_file }} of downloaded dist (consumer path)
        # Re-verify the downloaded artifact with the repository's consumer-side
        # verifier — the exact script dist consumers use — read-only against
        # the exact files about to be published (no dependencies, no network).
        # The checksum manifest name is the one the manifest declares
        # (stage.checksum_file, resolved by the release-meta step above), so a
        # renamed checksum file is verified under its declared name, exactly
        # like the packaging job's pre-upload gate. This is the same
        # verification the packaging job ran before upload, re-run here on the
        # downloaded bytes, so the release can never attach a dist whose
        # checksum manifest does not match its own files.
        env:
          CHECKSUM_FILE: ${{ steps.release-meta.outputs.checksum_file }}
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\verify-checksums.ps1 -DistDir dist\windows -ChecksumFile "dist\windows\$env:CHECKSUM_FILE"

      - name: Smoke-test the downloaded CLI artifact
        # End-to-end proof that the exact binary being published runs: execute
        # the downloaded release executable's editor-kernel smoke flow (apply
        # an edit, undo, redo, assert the document text) directly from
        # dist/windows. The CLI panics on any failure, so a non-zero exit
        # fails the run before the release is created. The headless shell is
        # not executed here (it starts an event loop and would block the
        # runner), matching the packaging job's smoke step.
        run: .\dist\windows\nextide-cli.exe smoke

      - name: Publish GitHub Release
        # Create the GitHub Release for the pushed tag with the verified
        # artifacts attached: both release binaries, the manifest-declared
        # checksum manifest (stage.checksum_file, resolved by the release-meta
        # step above) that proves them, and the validated manifest.json
        # release metadata. gh is preinstalled on the runner; the release is
        # created under the tag pushed (v<product.version>, asserted above)
        # targeting the tagged commit. If a release for this tag already
        # exists, gh fails with a non-zero exit and the job fails — a release
        # is never silently overwritten. The notes state the version/channel
        # and point consumers at the checksum manifest, which can be verified
        # with `sha256sum -c <checksum file>` or verify-checksums.ps1.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ steps.release-meta.outputs.channel }}
          VERSION: ${{ steps.release-meta.outputs.version }}
          CHECKSUM_FILE: ${{ steps.release-meta.outputs.checksum_file }}
        run: |
          $T = [char]96  # backtick, for markdown code spans in the notes
          $Notes = @"
          ## NextIDE $env:VERSION ($env:CHANNEL)

          Windows x86_64 release binaries (pinned target x86_64-pc-windows-msvc), built with
          cargo build --release --locked and staged/verified by packaging/windows/build.ps1 from
          the committed packaging/windows/manifest.json. Every binary is covered by the
          $env:CHECKSUM_FILE checksum manifest attached below (GNU sha256sum -c compatible).

          **Artifacts**

          - nextide-cli.exe — NextIDE command-line interface (usage/help and the editor-kernel smoke flow)
          - nextide-shell.exe — NextIDE headless desktop shell bootstrap (command registry, Git status/diff model layer)
          - $env:CHECKSUM_FILE — SHA-256 checksum manifest (one '<hash>  <file>' line per binary)
          - manifest.json — validated release metadata (license / publisher / release_channel / artifact list)

          **Verify**

          - ${T}sha256sum -c $env:CHECKSUM_FILE${T} (GNU/coreutils) or
          - ${T}powershell -ExecutionPolicy Bypass -File packaging\windows\verify-checksums.ps1 -DistDir <dir>${T}
          "@
          $NotesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $NotesFile -Value $Notes -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" `
            'dist/windows/nextide-cli.exe' `
            'dist/windows/nextide-shell.exe' `
            "dist/windows/$env:CHECKSUM_FILE" `
            'release-metadata/manifest.json' `
            --title "NextIDE $env:VERSION ($env:CHANNEL)" `
            --notes-file $NotesFile
