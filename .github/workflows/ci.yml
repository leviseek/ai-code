name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # The project targets Windows, so the CI pipeline runs on a Windows runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint (clippy, warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  packaging-windows:
    # Produce and upload the Windows release artifacts (dist/windows). Runs
    # only after the checks above pass: `needs: ci` makes the run fail fast,
    # so a failing fmt/clippy/test check stops the pipeline before packaging
    # ever starts. The job explicitly verifies the packaging manifest in all
    # four required areas — manifest validity, product.version vs the Cargo
    # workspace version, the target block vs the pinned x86_64-pc-windows-msvc
    # packaging target, and the release metadata (license / publisher /
    # release_channel) — twice, with no duplicated logic: first the sandboxed
    # self-test gate (test-build.ps1, 23 cases) proves build.ps1 rejects every
    # violation, then build.ps1 -SkipBuild re-runs the same read-only
    # validation against the committed manifest.json and the real Cargo.toml
    # before anything is staged. The release binaries are built here
    # (cargo build --release) and the packaging script is invoked with
    # -SkipBuild, which stages and verifies the freshly built artifacts
    # without rebuilding. The staged directory is uploaded as a
    # channel-suffixed workflow artifact (nextide-windows-dist-<channel>):
    # right after checkout the job reads release.release_channel from the
    # committed packaging/windows/manifest.json (read-only, no network) and
    # uses it as the artifact name suffix, so stable and beta runs can never
    # overwrite each other's artifact in the Actions artifact store. Before
    # the upload, the staged CLI binary itself is smoke-tested end to end
    # (nextide-cli.exe smoke), so the artifact that ships is proven to run,
    # not just to hash-match its source. Alongside the staged binaries the
    # job also uploads the committed packaging/windows/manifest.json as a
    # channel-suffixed release-metadata artifact (nextide-windows-manifest-
    # <channel>): the validated product identity (name/version), pinned
    # target, release metadata (license / publisher / release_channel) and
    # artifact list that produced this release travel with it, so later
    # release/publish steps can consume the exact single source of truth
    # without re-deriving anything.
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release channel from manifest (artifact name suffix)
        # Read release.release_channel out of the committed packaging manifest
        # (packaging/windows/manifest.json) so the workflow artifact carries
        # the channel in its name: stable and beta runs can never overwrite
        # each other's artifact. Read-only parse of a local file — no network,
        # no cargo invocation. The channel must be exactly stable or beta, the
        # same rule build.ps1 enforces (and the self-test gate and the
        # -SkipBuild run re-verify against the same committed manifest), so an
        # undeclared channel fails the run here, before the self-test gate, the
        # release build, and staging. The value is also exposed as the step
        # output release_channel for any later step to consume.
        id: release-channel
        shell: pwsh
        run: |
          $Manifest = Get-Content -Raw -LiteralPath 'packaging/windows/manifest.json' | ConvertFrom-Json
          $Channel = $Manifest.release.release_channel
          if ($Channel -ne 'stable' -and $Channel -ne 'beta') {
            throw "Manifest release.release_channel must be exactly stable or beta, got: '$Channel'"
          }
          Write-Host "release_channel=$Channel"
          "release_channel=$Channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify manifest / version / target / metadata (test-build.ps1 gate)
        # Pre-packaging self-test gate: this is the CI job's explicit
        # verification of the packaging manifest in all four required areas,
        # exercised through build.ps1's own validation by the sandboxed suite
        # (23 cases, zero framework):
        #   - manifest validity:  missing/invalid JSON, schema_version,
        #                         artifact list, path escapes
        #   - version:            product.version == Cargo.toml
        #                         [workspace.package] version
        #   - target:             os/architecture/triple == pinned
        #                         x86_64-pc-windows-msvc packaging target
        #   - release metadata:   license/publisher required, release_channel
        #                         exactly stable or beta
        # Every test runs build.ps1 against a throwaway sandbox copy under
        # $env:TEMP and never touches the repository, so a failing test stops
        # the run before anything is built or staged.
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\test-build.ps1

      - name: Build release binaries
        run: cargo build --release

      - name: Stage release artifacts into dist/windows (-SkipBuild)
        # Re-runs the same read-only manifest verification the self-test gate
        # covered (manifest validity, version, target, release metadata)
        # against the committed manifest.json and the real Cargo.toml before
        # staging anything, then verifies each staged artifact by size and
        # SHA-256. No rebuild: the release binaries from the step above are
        # staged as-is.
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -SkipBuild

      - name: Smoke-test the staged CLI artifact (nextide-cli.exe smoke)
        # End-to-end proof that the packaged binary actually runs: execute the
        # staged release executable's editor-kernel smoke flow (apply an edit,
        # undo, redo, assert the document text) directly from dist/windows.
        # The CLI panics on any failure, so a non-zero exit fails the run
        # before the artifact is uploaded — hash equality alone would not
        # catch a binary that fails to start or misbehaves at runtime. The
        # headless shell is not executed here (it starts an event loop and
        # would block the runner).
        run: .\dist\windows\nextide-cli.exe smoke

      - name: Upload dist/windows artifact
        # The artifact name carries the manifest's release_channel suffix
        # (resolved by the step above), so stable and beta runs produce
        # distinct artifacts and can never overwrite each other.
        uses: actions/upload-artifact@v4
        with:
          name: nextide-windows-dist-${{ steps.release-channel.outputs.release_channel }}
          path: dist/windows
          if-no-files-found: error

      - name: Upload manifest.json release metadata artifact
        # Upload the committed packaging manifest as release metadata next to
        # the staged binaries. manifest.json is the exact single source of
        # truth the whole packaging pipeline consumed and validated (self-test
        # gate, then read-only by build.ps1 -SkipBuild against the real
        # Cargo.toml): product identity, pinned target, release metadata
        # (license / publisher / release_channel) and the artifact list.
        # Shipping it with the release lets later release/publish steps attach
        # the metadata without re-deriving anything. The artifact name uses
        # the same resolved release_channel output as the dist artifact, so
        # stable and beta runs keep their release metadata separate too.
        uses: actions/upload-artifact@v4
        with:
          name: nextide-windows-manifest-${{ steps.release-channel.outputs.release_channel }}
          path: packaging/windows/manifest.json
          if-no-files-found: error
